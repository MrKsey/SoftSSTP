Builds:
  - versionName: 1.7.1
    versionCode: 161
    commit: ff383303dfb1b3850e12eea79f9dcaa78a0ef30b
    subdir: SoftSSTP
    submodules: true
    sudo:
      - mkdir -p /home/runner/work/SoftSSTP
      - chown -R vagrant /home/runner/work/SoftSSTP
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/MrKsey/SoftSSTP/releases/download/v%v/SoftSSTP-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - SoftSSTP/ios
      - SoftSSTP/linux
      - SoftSSTP/macos
      - SoftSSTP/web
      - SoftSSTP/windows
      - softether_flutter/android/src/main/cpp/openssl/fuzz/corpora
      - softether_flutter/android/src/main/cpp/openssl/cloudflare-quiche
      - softether_flutter/android/src/main/cpp/openssl/pkcs11-provider
      - softether_flutter/android/src/main/cpp/openssl/tlsfuzzer
      - softether_flutter/android/src/main/cpp/openssl/tlslite-ng
      - softether_flutter/android/src/main/cpp/openssl/gost-engine
      - softether_flutter/android/src/main/cpp/openssl/wycheproof
      - softether_flutter/android/src/main/cpp/openssl/pyca-cryptography
      - softether_flutter/android/src/main/cpp/openssl/python-ecdsa
      - softether_flutter/android/src/main/cpp/openssl/krb5
      - softether_flutter/android/src/main/cpp/openssl/oqs-provider
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\s'(.*)'/\1/p" ../.github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export orig=$(cd .. && pwd)
      - export proj=/home/runner/work/SoftSSTP/SoftSSTP/SoftSSTP
      - mv $orig /home/runner/work/SoftSSTP/SoftSSTP
      - cd $proj
      - export PUB_CACHE=$proj/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - mv /home/runner/work/SoftSSTP/SoftSSTP $orig
      - cd $orig/SoftSSTP
    scanignore:
      - softether_flutter/pubspec.yaml
      - sstp_flutter/pubspec.yaml
    scandelete:
      - SoftSSTP/.pub-cache
    build:
      - export orig=$(cd .. && pwd)
      - export proj=/home/runner/work/SoftSSTP/SoftSSTP/SoftSSTP
      - mv $orig /home/runner/work/SoftSSTP/SoftSSTP
      - cd $proj
      - export PUB_CACHE=$proj/.pub-cache
      - export PATH=$$NDK$$/prebuilt/linux-x86_64/bin:$PATH
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - mv /home/runner/work/SoftSSTP/SoftSSTP $orig
      - cd $orig/SoftSSTP
    ndk: 28.2.13676358

