MaintainerNotes: |-
  Version name and code come from SoftSSTP/pubspec.yaml (the number after "+").
  Every release bumps both and is tagged vX.Y.Z; the tag must match the pubspec
  version. Split APKs use versionCode * 10 + slot (armeabi-v7a = 1,
  arm64-v8a = 2), mirrored in VercodeOperation and in build.gradle.kts.
  The release workflow builds the split APKs and uploads them as
  SoftSSTP-<version>-<abi>.apk, which is what `binary` points at, so the APK
  published here is the upstream one, signed with the maintainer's key
  (AllowedAPKSigningKeys).
  F-Droid also builds the APK from source and compares the result with the
  release, so both builds have to produce the same bytes. A few details keep them
  identical. OpenSSL is built with a fixed prefix, because OPENSSLDIR, ENGINESDIR
  and MODULESDIR are compiled into libcrypto and the build directory would
  otherwise leak into .rodata. Its build date is a constant in the build script,
  because mkbuildinf.pl bakes it into the "built on: ..." string, and the string
  table in .rodata is ordered by content: a different date moves that string to a
  different place and changes the section. It has to be a constant rather than
  something derived, since fdroidserver exports SOURCE_DATE_EPOCH (the app
  commit date) while GitHub Actions exports nothing. The linker build-id is
  dropped for every native module, because it hashes the debug info, which
  records the NDK path. The build path matters for the same reason, so prebuild
  and build move the whole checkout to /home/runner/work/SoftSSTP/SoftSSTP, the
  path actions/checkout uses on the GitHub runner. The whole tree moves, not just
  the Flutter project: pubspec.yaml pulls softether_flutter and sstp_flutter in
  as path dependencies from the repository root, and Dart records their absolute
  paths, so the layout has to match upstream as well. The Flutter project itself
  then sits at /home/runner/work/SoftSSTP/SoftSSTP/SoftSSTP.
  The SoftEther plugin builds OpenSSL (pinned submodule) from source during the
  Gradle build, so the buildserver needs bash and perl (both present) plus GNU
  make. make is added to PATH from the NDK's own prebuilt bin, since the
  fdroiddata CI image does not ship one. No prebuilt .so/.a files are committed.
  OpenSSL's nested submodules (fuzz corpora, cloudflare-quiche, the provider and
  tls test data) are removed via rm before the scan: they are unused test data
  that the binary scanner would otherwise report. Only fuzz/corpora is dropped,
  not fuzz/ itself, so fuzz/build.info stays for OpenSSL's build system.
  softether_flutter and sstp_flutter are in-tree Flutter plugin packages whose
  pubspec.lock files are generated artifacts not tracked upstream, so their
  pubspec.yaml files are excluded from the dependency-lock check.
  android/app/build.gradle.kts turns off AGP's dependenciesInfo: without it AGP
  8.5+ embeds a Play 'Dependency metadata' block in the APK signing block, which
  the F-Droid scanner rejects as an extra signing block. AGP exposes no Gradle
  property for this, so the DSL block lives in the build script itself, and both
  the GitHub and the F-Droid build produce an APK without it.
  The app checks the GitHub release page for a newer version and opens that page
  in the browser. It does not download or install APKs itself, and nothing in the
  build switches the app between channels, so one APK serves both GitHub and
  F-Droid.
  The app contacts non-free network services for optional features: the VPN Gate
  public server list (vpngate.net) and IP geolocation providers (ipwho.is,
  ipapi.co, ip-api.com, api.ipify.org, icanhazip.com). The tunnel itself works
  with any user-supplied SSTP or SoftEther server and does not depend on them.

