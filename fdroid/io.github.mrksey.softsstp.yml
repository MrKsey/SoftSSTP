# F-Droid build recipe for SoftSSTP.
#
# This file does NOT belong in the app repository. It has to be copied into the
# fdroiddata repository (https://gitlab.com/fdroid/fdroiddata) as
# metadata/io.github.mrksey.softsstp.yml, then submitted as a merge request.
# It is kept here as the source of truth so it can be updated with each release.
#
# Before submitting: release the version below (push the matching vX.Y.Z tag)
# and, ideally, replace `commit` with that tag's full commit hash.

Categories:
  - Internet
License: GPL-3.0-only
AuthorName: MrKsey
SourceCode: https://github.com/MrKsey/SoftSSTP
IssueTracker: https://github.com/MrKsey/SoftSSTP/issues
Changelog: https://github.com/MrKsey/SoftSSTP/releases
Donate: bitcoin:bc1qdf9wryj6tnyyr7ed4dkfv03nn0dxjf27xshfcr

AutoName: SoftSSTP

RepoType: git
Repo: https://github.com/MrKsey/SoftSSTP.git

Builds:
  - versionName: 1.0.0
    versionCode: 11
    commit: v1.0.0
    subdir: SoftSSTP
    # The SoftEther plugin cross-compiles OpenSSL from the pinned git submodule
    # (F-Droid forbids shipping prebuilt native binaries), so the submodule has
    # to be checked out during the build.
    submodules: true
    # Matches the ndkVersion pinned in softether_flutter/android/build.gradle.
    ndk: 28.2.13676358
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - SoftSSTP/ios
      - SoftSSTP/linux
      - SoftSSTP/macos
      - SoftSSTP/web
      - SoftSSTP/windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\s*'(.*)'/\1/p" ../.github/workflows/release.yml)
      - test -n "$flutterVersion"
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - SoftSSTP/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

