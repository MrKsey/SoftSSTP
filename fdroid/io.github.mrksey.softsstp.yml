AutoUpdateMode: Version
UpdateCheckMode: Tags
# The version code and name live in SoftSSTP/pubspec.yaml, e.g. "1.2.0+2".
UpdateCheckData: SoftSSTP/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
# Each ABI gets versionCode * 10 + slot (arm = 1, arm64 = 2). The same slot
# numbers are set in SoftSSTP/android/app/build.gradle.kts.
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
CurrentVersion: '1.2.0'
CurrentVersionCode: 22

MaintainerNotes: |
  Version name and code come from SoftSSTP/pubspec.yaml (the number after "+").
  Every release bumps both and is tagged vX.Y.Z; the tag must match the pubspec
  version. Split APKs use versionCode * 10 + slot (armeabi-v7a = 1,
  arm64-v8a = 2), mirrored in VercodeOperation and in build.gradle.kts.
  The SoftEther plugin builds OpenSSL (pinned submodule) from source during the
  Gradle build, so the buildserver needs bash, perl and make (all present) and
  the NDK above. No prebuilt .so/.a files are committed.
  No reproducible build: the app is signed with F-Droid's key.
