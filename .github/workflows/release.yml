name: Build & Release

# Builds the SoftSSTP Android app and publishes GitHub Releases.
# - The version lives in SoftSSTP/pubspec.yaml (name and code) and is the single
#   source of truth. Bump it before tagging a release.
# - Pushing a `v*` tag builds that version and publishes a GitHub Release. The
#   tag must match the version in pubspec.yaml.
# - Pushing to `main` only builds (no release), so breakage shows up early.
# - Documentation and F-Droid metadata changes do not trigger a build.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - '**/*.MD'
      - 'README*'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'fastlane/**'
      - 'fdroid/**'
      # The bundled server list is data, not code; the snapshot workflow updates
      # it on its own and a refresh does not need a build.
      - 'SoftSSTP/assets/data/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create a GitHub Release for the current version'
        type: boolean
        default: false

permissions:
  contents: write

# No concurrency group: a release is two pushes to the same commit (the version
# bump on `main`, then the `v*` tag), and both get their own run so the `main`
# build is not cancelled by the tag run. The tag run also publishes the release.
jobs:
  build:
    name: Build release APKs
    runs-on: ubuntu-latest

    env:
      # Empty unless the KEYSTORE_BASE64 secret is configured. Used to decide
      # whether the stable release keystore can be restored.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The SoftEther plugin builds OpenSSL from source (F-Droid rule: no
          # prebuilt binaries), so the pinned submodule must be checked out.
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="$(grep -oP "ndkVersion\s+'\K[^']+" softether_flutter/android/build.gradle | head -n1)"
          echo "Required NDK: ${NDK_VERSION}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "${SDKMANAGER}" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -x "${SDKMANAGER}" ]; then
            yes | "${SDKMANAGER}" --install "ndk;${NDK_VERSION}" > /dev/null || true
          else
            echo "sdkmanager not found; the Android Gradle Plugin will fetch the NDK."
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # pubspec.yaml is the single source of truth for both the version name
          # and the version code (the number after "+").
          PUBSPEC_VERSION=$(grep -E '^version:' SoftSSTP/pubspec.yaml | head -n1 \
            | sed -E 's/version:[[:space:]]*//')
          VERSION="${PUBSPEC_VERSION%%+*}"
          BUILD="${PUBSPEC_VERSION##*+}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${VERSION}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${VERSION}. Bump SoftSSTP/pubspec.yaml before tagging."
              exit 1
            fi
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=${VERSION} build=${BUILD} tag=${TAG}"

      - name: Restore signing keystore
        working-directory: SoftSSTP/android
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set - the APK will be signed with the debug key."
            exit 0
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > app/softsstp-release.jks
          cat > key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=softsstp-release.jks
          EOF
          echo "Release keystore restored."

      - name: Get dependencies
        working-directory: SoftSSTP
        run: flutter pub get

      - name: Generate app icons
        working-directory: SoftSSTP
        run: dart run flutter_launcher_icons

      - name: Build APKs (arm64 + arm)
        working-directory: SoftSSTP
        run: |
          # The version comes from pubspec.yaml, so no --build-name/--build-number
          # flags are passed; the tag check above keeps them in sync.
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm64,android-arm

      - name: Collect and rename APKs
        working-directory: SoftSSTP
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/SoftSSTP-${V}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "out/SoftSSTP-${V}-armeabi-v7a.apk"
          ls -la out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoftSSTP-${{ steps.version.outputs.version }}-apks
          path: SoftSSTP/out/SoftSSTP-*.apk

      - name: Publish GitHub Release
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SoftSSTP ${{ steps.version.outputs.version }}
          files: SoftSSTP/out/SoftSSTP-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
